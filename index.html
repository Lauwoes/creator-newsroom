<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Creator Newsroom, a desk simulation on real data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f1f2ef; --card:#ffffff; --ink:#16181d; --ink2:#454a54; --mute:#6f7480; --line:#d8dad4; --line2:#e8e9e4;
    --red:#b03a1b; --red-bg:#f8e6e0; --blue:#2b5ba6; --blue-bg:#e3eaf6;
    --green:#2f7a3d; --green-bg:#e2f0e4; --amber:#9a6a12; --amber-bg:#f7ecd2;
    --serif:'Source Serif 4', Georgia, 'Times New Roman', serif; --sans:Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  a{color:var(--blue)}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px}
  .btn:hover{background:#2b2f37}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.secondary:hover{background:#fff}
  .btn.red{background:var(--red);border-color:var(--red)}
  .btn.red:hover{background:#8f2e14}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:default}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* top bar */
  .top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:20px;padding:10px 22px;flex-wrap:wrap}
  .top .mast{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.2px}
  .top .brand{color:#b9bcc5;font-size:14px}
  .top .spacer{flex:1}
  .top .day{display:flex;align-items:center;gap:12px;font-size:14px;color:#dfe1e6}
  .top .day strong{font-family:var(--serif);font-size:26px;font-weight:600;color:#fff;line-height:1}
  .top .btn{background:#fff;color:var(--ink);border-color:#fff}
  .top .btn:hover{background:#e6e7ea}
  .top .btn.secondary{background:transparent;color:#dfe1e6;border-color:#565b66}
  .top .btn.secondary:hover{background:#2b2f37}
  .sim{font-size:12px;color:#b9bcc5;border:1px solid #565b66;border-radius:999px;padding:2px 9px}
  .sim.live{color:#bfe3c6;border-color:#3f7a4a}
  .sim.snap{color:#f3e0a8;border-color:#8a6a2a}

  /* layout */
  .wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
  nav{border-right:1px solid var(--line);padding:18px 12px;background:#eaebe7}
  nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;color:var(--ink2);font-size:14px;font-weight:500}
  nav button:hover{background:#fff}
  nav button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
  nav .count{float:right;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px;margin-top:2px}
  nav .group{font-size:12px;color:var(--mute);padding:14px 12px 4px}
  main{padding:26px 30px 60px;max-width:1240px;min-width:0}
  .wrap > *, .card, .grid2 > *, .grid3 > *{min-width:0}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.3px;margin:0 0 6px}
  h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 10px}
  h3{font-size:15px;font-weight:600;margin:0 0 4px}
  .lead{color:var(--ink2);max-width:72ch;margin:0 0 22px}
  .muted{color:var(--mute)}
  .small{font-size:13px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid2.wide{grid-template-columns:1.6fr 1fr}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .card.flat{background:transparent}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .stat .n{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1.05;letter-spacing:-.5px}
  .stat .l{color:var(--ink2);font-size:13px;margin-top:6px}
  .tag{display:inline-block;font-size:12px;border-radius:4px;padding:1px 7px;font-weight:600;white-space:nowrap}
  .tag.gt{background:var(--blue-bg);color:var(--blue)}
  .tag.wm{background:#ece6f7;color:#5b3d9e}
  .tag.yt{background:#fbe3e3;color:#a12626}
  .tag.gr{background:var(--green-bg);color:var(--green)}
  .tag.am{background:var(--amber-bg);color:var(--amber)}
  .tag.rd{background:var(--red-bg);color:var(--red)}
  .tag.nt{background:var(--line2);color:var(--ink2)}
  .tag.bl{background:var(--blue-bg);color:var(--blue)}
  .tag.est{background:#fff;border:1px dashed var(--line);color:var(--mute);font-weight:500}
  .sim-note{font-size:12px;color:var(--mute);border-left:2px solid var(--line);padding-left:8px;margin-top:10px}
  .src{font-size:12px;color:var(--mute);margin-top:4px}
  .src a{color:var(--mute)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:600;color:var(--ink2);font-size:13px;border-bottom:1px solid var(--line);padding:8px 10px}
  td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .tablewrap{overflow-x:auto}
  .bar{height:12px;background:var(--line2);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--red);border-radius:999px}
  .bar.blue > i{background:var(--blue)}
  .bar.grey > i{background:#9a9ea8}
  .bar.green > i{background:var(--green)}
  textarea{width:100%;min-height:150px;font:inherit;font-size:14px;line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  mark{border-radius:3px;padding:0 2px}
  mark.rd{background:#f5c9bd}
  mark.am{background:#f3e0a8}
  pre.brief{white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.55;background:#fafaf8;border:1px solid var(--line2);border-radius:6px;padding:14px;margin:8px 0 0}
  .piece{border:1px solid var(--line);border-radius:8px;background:#fff;padding:16px 18px;margin-bottom:12px}
  .piece header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .piece .title{font-family:var(--serif);font-size:19px;font-weight:600}
  .steps{display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
  .steps span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--line2);color:var(--mute)}
  .steps span.done{background:var(--ink);color:#fff}
  .steps span.now{background:var(--red);color:#fff}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  details summary{cursor:pointer;color:var(--blue);font-size:14px;margin-top:8px}
  .trend{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line2)}
  .trend:last-child{border-bottom:0}
  .trend .t{font-family:var(--serif);font-size:18px;font-weight:600}
  .trend.faded{opacity:.45}
  .mom{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;text-align:right}
  .mom small{display:block;font-family:var(--sans);font-size:12px;color:var(--mute);font-weight:400;margin-top:2px}
  .log{font-size:13px;color:var(--ink2);max-height:420px;overflow:auto}
  .log div{padding:6px 0;border-bottom:1px solid var(--line2)}
  .log b{color:var(--ink)}
  .empty{border:1px dashed var(--line);border-radius:8px;padding:22px;color:var(--mute);text-align:center}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
  .kv dt{color:var(--mute)} .kv dd{margin:0}
  .wave{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fff}
  .wave .w{font-family:var(--serif);font-size:18px;font-weight:600}
  .wave ul{margin:8px 0 0;padding-left:18px;font-size:13px}
  ul.tight{margin:6px 0 0;padding-left:18px}
  ul.tight li{margin-bottom:4px}
  @media (max-width:900px){
    .top{position:static;gap:8px 12px;padding:10px 16px}
    .top .brand{display:none}
    .wrap{grid-template-columns:1fr}
    nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow:auto;padding:8px}
    nav button{width:auto;white-space:nowrap} nav .group{display:none} nav .count{float:none;margin-left:6px}
    .grid2,.grid3,.grid2.wide{grid-template-columns:1fr}
    main{padding:18px 16px 60px}
    .kv{grid-template-columns:110px 1fr}
  }
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="top">
  <div class="mast">The Creator Newsroom</div>
  <div class="brand" id="brandLine"></div>
  <span class="sim">Simulation on real data</span>
  <span class="sim" id="dataInd">Data: loading</span>
  <div class="spacer"></div>
  <div class="day">Day <strong id="dayNum">1</strong>
    <button class="btn" onclick="advanceDay()">Advance one day</button>
    <button class="btn secondary" onclick="resetAll()">Reset</button>
  </div>
</div>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

/* ===================== LIVE DATA ===================== */
let LIVE = SNAPSHOT;           // replaced by data/live.json when it loads
let DATA_MODE = "snapshot";    // "live" once data/live.json has loaded
let WM_REFRESHED = 0;          // Wikipedia cards refreshed in this browser

function liveTrend(id){ return (LIVE.trends || []).find(t => t.id === id) || null; }
function creatorList(){ return LIVE.creators || []; }

async function loadLive(){
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 6000);
    const r = await fetch("./data/live.json", { cache: "no-store", signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    if (j && Array.isArray(j.creators) && j.creators.length >= 8 && Array.isArray(j.trends)) { LIVE = j; DATA_MODE = "live"; }
  } catch (e) { /* keep the embedded snapshot */ }
  softRender();
  refreshWikipedia();
}

// Wikimedia's pageviews API allows plain browser requests (Access-Control-Allow-Origin: *).
// Refresh the Wikipedia-backed cards with today's figures; keep the daily file's values if anything fails.
async function refreshWikipedia(){
  // Every Wikipedia-backed signal the board shows, including the secondary ('also') ones.
  const ids = [];
  DATA.board.forEach(c => [c.live, c.also].forEach(id => { if (id && id.startsWith("wm-") && !ids.includes(id)) ids.push(id); }));
  const cards = ids.map(liveTrend).filter(t => t && t.article);
  const end = new Date(Date.now() - 24 * 3600 * 1000); // yesterday UTC (today's total is not complete yet)
  const start = new Date(end.getTime() - 27 * 24 * 3600 * 1000); // 28 days, like the daily script
  const ymd = d => d.toISOString().slice(0, 10).replace(/-/g, "");
  const nice = d => d.toISOString().slice(0, 10);
  for (const t of cards) {
    try {
      const url = `https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/${encodeURIComponent(t.article)}/daily/${ymd(start)}/${ymd(end)}`;
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 5000);
      const r = await fetch(url, { signal: ctrl.signal }); clearTimeout(to);
      if (!r.ok) continue;
      const items = (await r.json()).items || [];
      if (items.length < 14) continue;
      const v = items.slice(-14).map(x => x.views);
      const last7 = v.slice(7).reduce((a, b) => a + b, 0), prev7 = v.slice(0, 7).reduce((a, b) => a + b, 0);
      if (prev7 < 200) continue;
      const peak = items.reduce((a, b) => (b.views > a.views ? b : a));
      const peakIso = String(peak.timestamp || "").replace(/^(\d{4})(\d{2})(\d{2}).*$/, "$1-$2-$3");
      t.value = last7; t.previousValue = prev7; t.change_pct = +((last7 / prev7 - 1) * 100).toFixed(1);
      t.window = `${nice(new Date(end.getTime() - 6 * 24 * 3600 * 1000))} to ${nice(end)} vs the 7 days before`;
      t.signal_text = `English Wikipedia views of the '${t.article.replace(/_/g, " ")}' article: ${fmt(last7)} in the 7 days to ${fmtDay(nice(end))}, ${t.change_pct >= 0 ? "up" : "down"} ${Math.abs(t.change_pct)}% on the previous 7 days (${fmt(prev7)}). Busiest day in the last ${items.length}: ${fmtDay(peakIso)} (${fmt(peak.views)} views).`;
      t.captured = new Date().toISOString(); t.browserRefreshed = true; t.stale = false;
      WM_REFRESHED += 1;
      await new Promise(res => setTimeout(res, 400));
    } catch (e) { /* keep the file's value */ }
  }
  if (WM_REFRESHED) softRender();
}

/* ===================== STATE ===================== */
const KEY = "creator-newsroom-sim-v2";
let state = null;
let screen = "meeting";
let STATE_RESET_NOTE = "";

function freshState(){
  return { day:1, pieces:[], amberUsed:0, redLogged:0, log:[], seq:0 };
}
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ s = undefined; }
  if (s && typeof s === "object" && Array.isArray(s.pieces)) { state = Object.assign(freshState(), s); return; }
  state = freshState();
  if (s !== null) STATE_RESET_NOTE = "Saved progress was from an older version of the page and was reset.";
}
// Drop saved pieces whose trend card or correspondent is no longer in the data (a rebalanced bench, a renamed card, an older build).
function pruneState(){
  if (!state || !Array.isArray(state.pieces) || creatorList().length < 8) return;
  const before = state.pieces.length;
  state.pieces = state.pieces.filter(p => cardById(p.trendId) && creatorById(p.creatorId));
  const dropped = before - state.pieces.length;
  if (dropped) { logIt(`${dropped} saved piece${dropped > 1 ? "s" : ""} dropped: the trend card or the correspondent is no longer in the data.`); save(); }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function logIt(text){ state.log.unshift({ day: state.day, text }); if (state.log.length > 80) state.log.length = 80; }

/* ===================== HELPERS ===================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cardById = id => DATA.board.find(t => t.id === id);
const creatorById = id => creatorList().find(c => c.id === id);
const fmt = n => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("en-US");
const money = n => "$" + Number(n).toLocaleString("en-US");
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
function fmtDate(iso){ if (!iso) return "–"; const d = new Date(iso); if (isNaN(d)) return esc(iso); return d.toLocaleString("en-GB", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", timeZone:"UTC" }) + " UTC"; }
function fmtDay(iso){ if (!iso) return "–"; const d = new Date(iso); if (isNaN(d)) return esc(iso); return d.toLocaleString("en-GB", { day:"numeric", month:"short", timeZone:"UTC" }); }
function toast(msg){ const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); }
function seeded(n){ const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); }
function srcKind(t){ if (!t) return "nt"; const id = t.id || ""; return id.startsWith("gt-") ? "gt" : id.startsWith("wm-") ? "wm" : id.startsWith("yt-") ? "yt" : "nt"; }
function srcTag(t){ const k = srcKind(t); const name = k === "gt" ? "Google Trends" : k === "wm" ? "Wikipedia pageviews" : k === "yt" ? "YouTube RSS" : "Source"; return `<span class="tag ${k}">${name}</span>`; }

// Momentum is derived from the real signal. Week-on-week change maps to 50 + change/2 (so +100% = 100, 0% = 50, -80% = 10).
// YouTube view totals, which have no week-on-week figure, map to 50 + 20 × log10(views / 10,000) (10k = 50, 100k = 70, 1M = 90).
// A search or pageview signal with no change figure (the fetcher writes null when a day is missing) is neutral, 50.
function momentumBase(card){
  const t = liveTrend(card.live);
  if (!t) return 50;
  if (t.change_pct != null && !isNaN(t.change_pct)) return clamp(Math.round(50 + t.change_pct / 2), 10, 100);
  if (srcKind(t) === "yt" && t.value) return clamp(Math.round(50 + 20 * Math.log10(t.value / 10000)), 15, 100);
  return 50;
}
function momentumNote(card){
  const t = liveTrend(card.live);
  if (!t) return "no signal in the data: neutral 50";
  if (t.change_pct != null && !isNaN(t.change_pct)) return "50 + week-on-week change ÷ 2";
  if (srcKind(t) === "yt" && t.value) return "50 + 20 × log10(views ÷ 10,000)";
  return "no change figure in the data: neutral 50";
}
function momentumNow(card){ if (state.day < card.appears) return null; return Math.max(0, momentumBase(card) - (state.day - card.appears) * card.decay); }

/* ===================== BENCH (real channels; rates and index are computed, and labelled) ===================== */
// Rate estimate. Sources: Agentio 2026 Playbook (average CPM by views tier: under 50k views $51, 50k to 300k $28, 300k+ $22;
// pay on first-30-day views); Creators Agency rate card 2026 (fee = normal views / 1,000 × CPM; usage rights +20% per 30 days);
// Agentio, 3 Sep 2026 (since YouTube's 24 Aug 2026 view-count change, about 52% of new public views in Fitness are engaged views).
// A Short is priced at half the integration, from one finance-sector Shorts benchmark (Creators Agency), so it is low confidence.
function estimateRates(c){
  if (!c.medianViews15) return null;
  const engaged = Math.round(c.medianViews15 * 0.52);
  const cpm = engaged < 50000 ? 51 : engaged < 300000 ? 28 : 22;
  const integration = Math.round(engaged * cpm / 1000 / 10) * 10;
  return { engaged, cpm, integration: Math.max(50, integration), short: Math.max(30, Math.round(integration * 0.5 / 10) * 10) };
}
function viewsPerSub(c){ return (c.medianViews15 && c.subscribers) ? c.medianViews15 / c.subscribers : null; }
function benchMedianVps(){ const v = creatorList().map(viewsPerSub).filter(x => x != null).sort((a, b) => a - b); if (!v.length) return 1; const m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; }
function reachIndex(c){ const v = viewsPerSub(c); if (v == null) return null; return +(v / benchMedianVps()).toFixed(2); }

/* ===================== STANDARDS CHECK (stands in for the Gemini first read) ===================== */
function checkDraft(text){
  const hits = [];
  DATA.claims.red.forEach(r => { const m = text.match(r.re); if (m) hits.push({ lane:"red", label:r.label, detail:r.detail, match:m[0] }); });
  DATA.claims.amber.forEach(r => { const m = text.match(r.re); if (m) hits.push({ lane:"amber", label:r.label, detail:r.detail, match:m[0] }); });
  if (!DATA.claims.disclosure.re.test(text)) hits.push({ lane:"amber", label:DATA.claims.disclosure.label, detail:DATA.claims.disclosure.detail, match:null });
  const lane = hits.some(h => h.lane === "red") ? "red" : hits.length ? "amber" : "green";
  return { lane, hits };
}
function highlight(text, hits){
  let out = esc(text);
  hits.filter(h => h.match).forEach(h => {
    const m = esc(h.match).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    out = out.replace(new RegExp(m, "i"), x => `<mark class="${h.lane === "red" ? "rd" : "am"}">${x}</mark>`);
  });
  return out;
}

/* ===================== DESK ACTIONS ===================== */
const pieceTitle = p => { const t = cardById(p.trendId); return t ? t.title : String(p.trendId); };
function oldPostDiscovery(){ return DATA.facts.oldStages.slice(2).reduce((s, [, d]) => s + d, 0); } // the stages after a commission exists
function bestCorrespondent(beat){
  const busy = new Set(state.pieces.filter(p => ["assigned","amber","legal"].includes(p.status)).map(p => p.creatorId));
  const cands = creatorList().filter(c => c.beat === beat).sort((a,b) => (b.medianViews15 || 0) - (a.medianViews15 || 0));
  if (!cands.length) return { c: null, why: "No correspondent on that beat" };
  const free = cands.find(c => !busy.has(c.id));
  if (!free) return { c: null, why: `Both ${DATA.beats[beat] || beat} correspondents are on a piece; try again when one clears` };
  return { c: free, why: "" };
}
function makeBrief(card, c, due){
  const t = liveTrend(card.live);
  const est = estimateRates(c);
  const mustNot = "No health or injury claims. No performance figures without a source. No superlatives. No competitor names. No race marks or implied official status. No offers beyond the agreement.";
  return `Brief for ${c.name} (${c.handle})\n` +
    `Piece: ${card.title}\n` +
    `Why now: ${t ? t.signal_text : card.title} Seen on day ${card.appears}, momentum ${momentumNow(card)} today.\n` +
    `Angle: ${card.angle}\n` +
    `Say: ${DATA.brand.product} by name once, in your own words. Show it in use.\n` +
    `Do not say: ${mustNot}\n` +
    `Deliverable: one integration of 60 to 90 seconds inside a regular upload, plus one Short.\n` +
    `Disclosure: say it on camera near the start and put #ad in the first line of the description (FTC).\n` +
    `Rate card (modelled estimate, not ${c.name}'s rate): integration ${est ? money(est.integration) : "–"}, Short ${est ? money(est.short) : "–"}. Boost rights would be included in the quarterly agreement.\n` +
    `Draft due: day ${due} (the desk's standard term: ${DATA.desk.draftDays} days).\n` +
    `Simulation note: this brief was not sent. ${c.name} has no relationship with ${DATA.brand.name} or this project.`;
}
function commission(cardId){
  const card = cardById(cardId);
  if (!card) { toast("Unknown trend card"); return; }
  if (card.redList) { toast("Red list: the desk does not brief this"); return; }
  const mom = momentumNow(card);
  if (mom === null || mom < 25) { toast("Too late: the trend has faded"); return; }
  if (state.pieces.some(p => p.trendId === cardId && p.status !== "killed")) { toast("Already commissioned"); return; }
  const pick = bestCorrespondent(card.beat); const c = pick.c;
  if (!c) { toast(pick.why); return; }
  const due = state.day + DATA.desk.draftDays;
  state.seq += 1;
  const p = { id:"p" + state.seq, n: state.seq, trendId: cardId, creatorId:c.id, commissionedDay: state.day, draftDueDay: due, status:"assigned",
    brief: makeBrief(card, c, due), draft:null, check:null, publishDay:null, liveDay:null, readDay:null, metrics:null, boosted:false, legalReturnDay:null, history:[`Day ${state.day}: commissioned and assigned to ${c.name}`] };
  state.pieces.unshift(p);
  logIt(`Commissioned "${esc(card.title)}" to <b>${esc(c.name)}</b>. Brief drafted from the style guide. Draft due day ${due}.`);
  save(); render(); toast("Commissioned (simulated). Brief drafted for " + c.name + "; nothing is sent.");
}
function resolveAmber(pid, choice){
  const p = state.pieces.find(x => x.id === pid); if (!p || p.status !== "amber") return; const title = pieceTitle(p);
  if (choice === "legal") {
    p.status = "legal"; p.legalReturnDay = state.day + DATA.desk.legalTurnaround; state.redLogged += 1;
    p.history.push(`Day ${state.day}: editor escalated to legal; back on day ${p.legalReturnDay}`);
    logIt(`Editor escalated "${esc(title)}" to legal. Logged.`); save(); render(); return;
  }
  if (state.amberUsed >= DATA.desk.amberAllowance) { toast(`The monthly amber allowance (${DATA.desk.amberAllowance}) is used: send it to legal or kill it`); return; }
  state.amberUsed += 1;
  const extra = choice === "change" ? 1 : 0;
  p.status = "cleared"; p.publishDay = state.day + 1 + extra;
  p.history.push(`Day ${state.day}: editor ${choice === "change" ? "asked for one change" : "approved as submitted"} (amber ${state.amberUsed} of ${DATA.desk.amberAllowance})`);
  logIt(`Amber decision on "${esc(title)}": ${choice === "change" ? "one change requested" : "approved"}. Publishes day ${p.publishDay}.`);
  save(); render();
}
function killPiece(pid){
  const p = state.pieces.find(x => x.id === pid); if (!p) return; const title = pieceTitle(p);
  p.status = "killed"; p.history.push(`Day ${state.day}: piece killed`);
  logIt(`Killed "${esc(title)}". The kill fee in the (simulated) agreement would apply.`); save(); render();
}
function boost(pid){
  const p = state.pieces.find(x => x.id === pid); if (!p || !p.metrics || p.boosted) return; const title = pieceTitle(p);
  // The 48-hour read stays as it was; the boosted figure is kept separately. ×3.2 is arbitrary: no published benchmark was found.
  p.boosted = true; p.status = "boosted";
  p.metrics.boostViews = Math.round(p.metrics.views * 3.2); p.metrics.boostEngaged = Math.round(p.metrics.boostViews * 0.52);
  p.history.push(`Day ${state.day}: boosted (simulated: an arbitrary ×3.2 on the 48-hour read; in the pilot this is Creator partnerships boost)`);
  logIt(`Boosted "${esc(title)}" (simulated ×3.2).`); save(); render(); toast("Boosted (simulated)");
}

/* ===================== THE CLOCK ===================== */
function advanceDay(){
  state.day += 1;
  const d = state.day;
  state.pieces.forEach(p => {
    const t = cardById(p.trendId), c = creatorById(p.creatorId);
    if (!t || !c) return;
    if (p.status === "assigned" && d >= p.draftDueDay) {
      const order = [0, 1, 4, 7, 2, 3, 5, 6, 8]; // green, amber, red, green, amber, amber, green, red, amber
      p.draft = DATA.drafts[order[(p.n - 1) % order.length]];
      p.check = checkDraft(p.draft);
      p.history.push(`Day ${d}: test script arrived (stands in for ${c.name}'s draft); first read: ${p.check.lane}`);
      if (p.check.lane === "green") { p.status = "cleared"; p.publishDay = d + 1; logIt(`"${esc(t.title)}" cleared on first read. Publishes day ${p.publishDay}.`); }
      else if (p.check.lane === "amber") { p.status = "amber"; p.amberSince = d; logIt(`"${esc(t.title)}" flagged amber (${p.check.hits.map(h => h.label).join(", ")}). Editor decision due within 24 hours.`); }
      else { p.status = "legal"; p.legalReturnDay = d + DATA.desk.legalTurnaround; state.redLogged += 1; logIt(`"${esc(t.title)}" flagged red (${p.check.hits.filter(h => h.lane === "red").map(h => h.label).join(", ")}). Sent to legal, back day ${p.legalReturnDay}.`); }
    }
    if (p.status === "legal" && d >= p.legalReturnDay) {
      p.status = "cleared"; p.publishDay = d + 1; p.history.push(`Day ${d}: legal returned the piece with changes`);
      logIt(`Legal returned "${esc(t.title)}" with changes. Publishes day ${p.publishDay}.`);
    }
    if (p.status === "cleared" && d >= p.publishDay) {
      p.status = "live"; p.liveDay = d; p.readDay = d + 2; p.history.push(`Day ${d}: live`);
      logIt(`"${esc(t.title)}" is live. Trend-to-live: ${d - t.appears} days.`);
    }
    if ((p.status === "live" || p.status === "boosted") && !p.metrics && d >= p.readDay) {
      // Simulated 48-hour projection: the channel's real median views (last 15 uploads, RSS) × (0.35 + 0.45 × momentum/100) × a seeded factor 0.7 to 1.5.
      const base = c.medianViews15 || 5000;
      const mom = Math.max(0.2, (momentumNow(t) || 20) / 100);
      const r = 0.7 + seeded(p.n) * 0.8;
      const views = Math.round(base * (0.35 + 0.45 * mom) * r);
      p.metrics = { views, engaged: Math.round(views * 0.52), median: base, vsMedian: Math.round((views / base - 1) * 100) };
      p.history.push(`Day ${d}: 48-hour read available (simulated projection)`);
      logIt(`48-hour read on "${esc(t.title)}" (simulated): ${fmt(views)} public views, ${fmt(p.metrics.engaged)} engaged, against a channel median of ${fmt(base)}.`);
    }
  });
  DATA.board.filter(t => t.appears === d).forEach(t => { const lt = liveTrend(t.live); logIt(`New on the trend board: "${esc(t.title)}" (${lt ? esc(lt.source_name) : "signal"}).`); });
  save(); render();
}
function resetAll(){ if (!confirm("Reset the simulation to day 1?")) return; state = freshState(); save(); screen = "meeting"; render(); }

/* ===================== RENDER ===================== */
const NAV = [
  ["meeting", "Morning meeting"], ["desk", "The desk"], ["standards", "Standards"], ["bench", "The bench"], ["waves", "Waves and terms"], ["dashboard", "Dashboard"], ["about", "What is real"]
];
// Stale counts are computed from the items themselves, so a card refreshed in the browser stops counting.
function staleCount(){ return (LIVE.creators || []).filter(c => c.stale || c.feedStale || c.subscribersStale).length + (LIVE.trends || []).filter(t => t.stale).length; }
function fileAgeHours(){ const d = new Date(LIVE.generatedAt); return isNaN(d) ? null : (Date.now() - d.getTime()) / 36e5; }
const FILE_OLD_AFTER_H = 36; // the Action runs daily; older than this means it has not run or has failed
function dataIndicator(){
  const el = document.getElementById("dataInd");
  const gen = LIVE.generatedAt, age = fileAgeHours(), old = age != null && age > FILE_OLD_AFTER_H;
  const stale = staleCount();
  const tail = (stale ? ` · ${stale} stale` : "") + (WM_REFRESHED ? ` · ${WM_REFRESHED} refreshed in browser` : "");
  const wmNote = WM_REFRESHED ? "; the Wikipedia cards were then refreshed directly from the Wikimedia API in this browser" : "";
  if (DATA_MODE === "live" && !old) { el.className = "sim live"; el.textContent = `Daily file · refreshed ${fmtDate(gen)}` + tail; el.title = "data/live.json, written by the daily GitHub Action, loaded when the page opened" + wmNote; }
  else if (DATA_MODE === "live") { el.className = "sim snap"; el.textContent = `Daily file from ${fmtDate(gen)}, not refreshed since` + tail; el.title = `data/live.json loaded, but it is more than ${FILE_OLD_AFTER_H} hours old: the daily GitHub Action has not run or has failed` + wmNote; }
  else { el.className = "sim snap"; el.textContent = `Snapshot · ${fmtDate(gen)}` + tail; el.title = "data/live.json could not be loaded; this is the copy embedded in the page" + wmNote; }
}
// Re-render after data arrives, unless the visitor is typing or on a screen the data does not change.
function softRender(){
  const a = document.activeElement;
  if ((a && a.tagName === "TEXTAREA") || screen === "standards" || screen === "waves") { dataIndicator(); return; }
  render();
}
function render(){
  pruneState();
  document.getElementById("dayNum").textContent = state.day;
  document.getElementById("brandLine").textContent = DATA.brand.name + ", hypothetical desk (Brooks is not involved)";
  dataIndicator();
  const pending = state.pieces.filter(p => p.status === "amber").length + state.pieces.filter(p => (p.status === "live") && p.metrics && !p.boosted).length;
  document.getElementById("nav").innerHTML = `<div class="group">Desk</div>` + NAV.map(([id, label]) =>
    `<button class="${screen === id ? "on" : ""}" onclick="go('${id}')">${label}${id === "desk" && pending ? `<span class="count">${pending}</span>` : ""}</button>`).join("");
  const views = { meeting, desk, standards, bench, waves, dashboard, about };
  document.getElementById("main").innerHTML = views[screen]();
}
function go(id){ screen = id; render(); window.scrollTo(0,0); }

function laneTag(l){ return l === "green" ? `<span class="tag gr">Green</span>` : l === "amber" ? `<span class="tag am">Amber</span>` : `<span class="tag rd">Red</span>`; }
function signalLine(t){
  if (!t) return `<div class="small muted">No live signal for this card in the data file.</div>`;
  const when = t.browserRefreshed ? `refreshed in this browser ${fmtDate(t.captured)}` : `captured ${fmtDate(t.captured)}`;
  return `<div class="small">${esc(t.signal_text)}</div>
    <div class="src">${srcTag(t)} <a href="${esc(t.source_url)}" target="_blank" rel="noopener">source</a>, ${when}${t.stale ? `, <span class="tag am">stale</span> last good value from ${fmtDay(t.lastSuccess)}` : ""}${t.caveats && t.caveats.length ? ` <span title="${esc(t.caveats.join(" "))}">(caveat)</span>` : ""}</div>`;
}

function meeting(){
  const visible = DATA.board.filter(t => state.day >= t.appears).sort((a,b) => (momentumNow(b)||0) - (momentumNow(a)||0));
  const rows = visible.map(card => {
    const m = momentumNow(card); const faded = m < 25;
    const done = state.pieces.find(p => p.trendId === card.id && p.status !== "killed");
    const killed = done ? null : state.pieces.find(p => p.trendId === card.id && p.status === "killed");
    const t = liveTrend(card.live), also = card.also ? liveTrend(card.also) : null;
    const killedTag = killed ? `<span class="tag nt">Killed, piece ${killed.n}</span> ` : "";
    let action;
    if (card.redList) action = `<span class="tag rd">Red list: not briefed</span> <span class="small muted">The editor checks the cause and passes.</span>`;
    else if (done) action = `<span class="tag bl">Commissioned, piece ${done.n}</span>`;
    else if (faded) action = `${killedTag}<span class="tag nt">Faded, too late to cover</span>`;
    else action = `${killedTag}<button class="btn small" onclick="commission('${card.id}')">${killed ? "Re-commission" : "Commission"}</button>`;
    return `<div class="trend ${faded ? "faded" : ""}">
      <div>
        <div class="t">${esc(card.title)}</div>
        <div class="small muted" style="margin:3px 0 6px"><span class="tag nt">${DATA.beats[card.beat] || esc(card.beat)}</span> seen day ${card.appears}</div>
        ${signalLine(t)}
        ${also ? `<div class="small" style="margin-top:6px">${esc(also.signal_text)}</div><div class="src">${srcTag(also)} <a href="${esc(also.source_url)}" target="_blank" rel="noopener">source</a>, ${also.browserRefreshed ? "refreshed in this browser" : "captured"} ${fmtDate(also.captured)}${also.stale ? `, <span class="tag am">stale</span> last good value from ${fmtDay(also.lastSuccess)}` : ""}</div>` : ""}
        <div class="small" style="margin-top:6px"><b>Angle (editor's note, ${esc(DATA.boardDate)}):</b> ${esc(card.angle)}</div>
        ${card.extra ? `<div class="src">${esc(card.extra)}</div>` : ""}
        <div class="actions">${action}</div>
      </div>
      <div class="mom" title="Modelled: ${esc(momentumNote(card))}, minus ${card.decay} for each day since day ${card.appears}">${m}<small>momentum (modelled)</small></div>
    </div>`;
  }).join("");
  return `<h1>Morning meeting, day ${state.day}</h1>
  <p class="lead">Ten minutes. The editor, the producer and the analyst look at what is rising in the category and what people are asking about the brand, and pick what to cover today; everything else waits. Every signal on the board is real and links to its source. Momentum falls every day a trend is not covered.</p>
  <div class="grid2 wide">
    <div class="card">${rows || `<div class="empty">Nothing on the board yet. Advance a day.</div>`}</div>
    <div>
      <div class="card"><h2>How a commission works</h2>
        <p class="small">Commission sends the trend to the correspondent on that beat with the higher median views who is not already on a piece. A brief is drafted from the style guide, the rate card applies, and the draft is due in ${DATA.desk.draftDays} days. No outreach, no negotiation, no sign-off meeting.</p>
        <div class="sim-note">${esc(DATA.brand.note)} In the pilot the board is fed by Google Trends, Insights Finder trending insights and the brand pulse report, and the brief is drafted by Gemini from the style guide in Gemini Notebook. Here the board runs on public stand-ins (Google Trends web data, Wikipedia pageviews, YouTube RSS), refreshed daily by a GitHub Action, and the brief is a template. The angles were written on ${esc(DATA.boardDate)}; the signals beneath them refresh. The day-by-day reveal, the decay and the momentum score are simulation mechanics.</div>
      </div>
      <div class="card" style="margin-top:16px"><h2>Desk log</h2><div class="log">${state.log.slice(0,12).map(l => `<div>Day ${l.day}: ${l.text}</div>`).join("") || `<div class="muted">Nothing yet.</div>`}</div></div>
    </div>
  </div>`;
}

const STEPS = ["Commissioned", "Draft", "First read", "Cleared", "Live", "Boosted"];
function stepIndex(p){ return { assigned:1, amber:2, legal:2, cleared:3, live:4, boosted:5, killed:2 }[p.status]; }
function pieceCard(p){
  const t = cardById(p.trendId), c = creatorById(p.creatorId);
  if (!t || !c) return "";
  const idx = stepIndex(p);
  const steps = STEPS.map((s, i) => `<span class="${i < idx ? "done" : i === idx ? "now" : ""}">${s}</span>`).join("");
  let status = "", actions = "";
  if (p.status === "assigned") status = `<span class="tag nt">Waiting for draft, due day ${p.draftDueDay}</span>`;
  if (p.status === "amber") {
    const late = state.day > p.amberSince + 1;
    const capped = state.amberUsed >= DATA.desk.amberAllowance;
    status = `${laneTag("amber")} ${late ? `<span class="tag rd">24-hour decision window missed</span>` : `<span class="tag nt">Editor decision due by day ${p.amberSince + 1}</span>`}${capped ? `<div class="small" style="margin-top:6px;color:var(--red)">The monthly amber allowance (${DATA.desk.amberAllowance}) is used: this piece goes to legal or is killed.</div>` : ""}`;
    actions = `<button class="btn small" onclick="resolveAmber('${p.id}','approve')"${capped ? " disabled title='Amber allowance used this month'" : ""}>Approve as submitted</button>
      <button class="btn small secondary" onclick="resolveAmber('${p.id}','change')"${capped ? " disabled title='Amber allowance used this month'" : ""}>Ask for one change (+1 day)</button>
      <button class="btn small secondary" onclick="resolveAmber('${p.id}','legal')">Send to legal</button>
      <button class="btn small secondary" onclick="killPiece('${p.id}')">Kill</button>`;
  }
  if (p.status === "legal") status = `${laneTag("red")} <span class="tag nt">With legal, back day ${p.legalReturnDay}</span>`;
  if (p.status === "cleared") status = `${laneTag("green")} <span class="tag nt">Publishes day ${p.publishDay}</span>`;
  if (p.status === "live" || p.status === "boosted") {
    status = `<span class="tag bl">Live since day ${p.liveDay}</span> <span class="tag nt">Trend-to-live ${p.liveDay - t.appears} days</span>${p.boosted ? ` <span class="tag rd">Boosted</span>` : ""}`;
    if (p.metrics) {
      status += `<div class="small" style="margin-top:8px">48-hour read (simulated): <b>${fmt(p.metrics.views)}</b> public views, ${fmt(p.metrics.engaged)} engaged, ${p.metrics.vsMedian >= 0 ? "+" : ""}${p.metrics.vsMedian}% against the channel's real median of ${fmt(p.metrics.median)}</div>${p.metrics.boostViews ? `<div class="small">After boost (simulated, an arbitrary ×3.2): ${fmt(p.metrics.boostViews)} public views, ${fmt(p.metrics.boostEngaged)} engaged</div>` : ""}`;
      if (!p.boosted) actions = `<button class="btn small red" onclick="boost('${p.id}')" title="In the pilot: Creator partnerships boost. Here: an arbitrary ×3.2 on the 48-hour read.">Boost (simulated)</button>`;
    } else status += `<div class="small muted" style="margin-top:8px">48-hour read available day ${p.readDay}</div>`;
  }
  if (p.status === "killed") status = `<span class="tag nt">Killed</span>`;
  const check = p.check ? `<details><summary>First read against the standards</summary>
      <div class="small muted" style="margin-top:6px">Test script used by the simulation. It was not written or said by ${esc(c.name)}.</div>
      <div style="margin-top:8px">${laneTag(p.check.lane)} ${p.check.hits.length ? "" : `<span class="small muted">Nothing flagged. Disclosure present.</span>`}</div>
      ${p.check.hits.length ? `<ul class="small" style="margin:8px 0 0;padding-left:18px">${p.check.hits.map(h => `<li><b>${h.label}</b>${h.match ? ` ("${esc(h.match)}")` : ""}: ${h.detail}</li>`).join("")}</ul>` : ""}
      <pre class="brief">${highlight(p.draft, p.check.hits)}</pre></details>` : "";
  return `<div class="piece">
    <header><div><div class="title">${esc(t.title)}</div><div class="small muted">Piece ${p.n}, <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a> (${esc(c.handle)}), ${DATA.beats[c.beat] || esc(c.beat)}. Commissioned day ${p.commissionedDay}. Simulated assignment; no contact was made.</div></div><div>${status}</div></header>
    <div class="steps">${steps}</div>
    <div class="actions">${actions}</div>
    <details><summary>Brief</summary><pre class="brief">${esc(p.brief)}</pre></details>
    ${check}
    <details><summary>History</summary><ul class="small" style="margin:8px 0 0;padding-left:18px">${p.history.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
      <div class="small muted" style="margin-top:6px">For comparison: on the illustrative ${DATA.facts.oldDays}-day timeline the stages after a commission exists (contract, script approval, production, final review) take ${oldPostDiscovery()} days, so the same piece would go live about day ${p.commissionedDay + oldPostDiscovery()}; published ranges put a typical deal at 2 to 6 weeks from first contact (Creators Agency, 2026, finance-sector deal data).</div></details>
  </div>`;
}

function standards(){

    <div>
      <div class="card"><h2>Test a script</h2>

          <li>Footwear precedents: <a href="https://www.ftc.gov/news-events/news/press-releases/2011/09/reebok-pay-25-million-customer-refunds-settle-ftc-charges-deceptive-advertising-easytone-runtone" target="_blank" rel="noopener">Reebok, $25M (FTC, 2011)</a>; <a href="https://www.ftc.gov/news-events/news/press-releases/2012/05/skechers-will-pay-40-million-settle-ftc-charges-it-deceived-consumers-ads-toning-shoes" target="_blank" rel="noopener">Skechers, $40M (FTC, 2012)</a>.</li>

function bench(){

  const rows = list.map(c => {

    let flagRef = "";
    if (c.flags && c.flags.length) { notes.push({ name: c.name, flags: c.flags }); flagRef = ` <sup><a href="#benchnotes" title="${esc(c.flags.join(" "))}">${notes.length}</a></sup>`; }
    return `<tr><td><b><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a></b>${flagRef}<div class="small muted">${esc(c.handle)}</div></td><td>${DATA.beats[c.beat] || esc(c.beat)}</td><td>${esc(c.subscribersText || fmt(c.subscribers))}${c.subscribersStale ? ` <span class="tag am">stale</span>` : ""}</td><td>${fmt(c.medianViews15)}${c.feedStale ? ` <span class="tag am">stale</span>` : ""}</td><td>${fmt(c.uploads30d)}${c.uploads30dIsFloor ? "+" : ""}${c.shortsInLast15 ? `<div class="small muted">${c.shortsInLast15} of 15 are Shorts</div>` : ""}</td><td>${idx == null ? "–" : idx.toFixed(2)}</td><td>${est ? `${money(est.integration)} / ${money(est.short)} <span class="tag est">est.</span>` : "–"}</td><td>${busy.has(c.id) ? `<span class="tag am">On a piece</span>` : `<span class="tag gr">Available</span>`}${done ? ` <span class="tag nt">${done} live</span>` : ""}</td></tr>`;
  }).join("");
  const cap = LIVE.creators && LIVE.creators[0] ? (LIVE.creators[0].subscribersCapturedAt || LIVE.generatedAt) : LIVE.generatedAt;
  return `<h1>The bench</h1>
  <p class="lead">Sixteen correspondents on a quarterly retainer, two per beat, chosen once and contracted once. When the desk commissions, the brief goes to the available correspondent on that beat with the higher median views. The channels below are real and public; the commercial terms are modelled.</p>
  <div class="card small" style="border-color:var(--amber);background:var(--amber-bg);margin-bottom:16px"><b>Real channels, hypothetical bench.</b> These sixteen are real public YouTube channels, found through public YouTube search on 22 Sep 2026 (in the pilot the list would come from YouTube Creator Partnerships). None of them is affiliated with ${DATA.brand.name} or with this project, none has been contacted, and none has agreed to anything. Subscriber counts and views are YouTube's public figures. Rates, the reach index and turnaround are calculated or set by the desk and are not facts about the people.</div>
  <div class="card"><div class="tablewrap"><table><tr><th>Correspondent</th><th>Beat</th><th>Subscribers (YouTube)</th><th>Median views, last 15 uploads (RSS)</th><th>Uploads, 30 days</th><th>Reach index</th><th>Rate card, integration / Short</th><th>Status</th></tr>${rows}</table></div>
    <div class="src" style="margin-top:8px">Counts captured ${fmtDate(cap)}${DATA_MODE === "live" ? " from the daily data file" : " (embedded snapshot)"}. Subscriber counts are YouTube's rounded public figures. Views are the feed's public count; since 24 Aug 2026 YouTube counts a view from the first frame.</div>
  </div>
  ${notes.length ? `<div class="card" style="margin-top:16px" id="benchnotes"><h3>Notes the desk must clear before contracting</h3><ol class="small" style="margin:6px 0 0;padding-left:18px">${notes.map(n => `<li><b>${esc(n.name)}:</b> ${esc(n.flags.join(" "))}</li>`).join("")}</ol></div>` : ""}
  <div class="grid3" style="margin-top:16px">
    <div class="card"><h3>Rate card: how the estimate is built</h3><p class="small">Median views of the last 15 uploads × 0.52 (the engaged share of public views in Fitness since YouTube's 24 Aug 2026 counting change) = engaged views. Engaged views ÷ 1,000 × the CPM for the tier: $51 under 50k views, $28 from 50k to 300k, $22 above. A Short is priced at half the integration. Every figure is a modelled estimate, not what the creator charges. Three caveats: for a channel whose last 15 uploads are all Shorts (the table shows the count) the integration price is derived from Shorts views; the 0.52 share describes views counted since 24 Aug 2026 but is applied to all 15 uploads, so a feed with older uploads is understated; and "a Short is half the integration" rests on one finance-sector benchmark, so it is low confidence.</p><div class="src">Sources: <a href="https://static.agentio.com/blog/2026-YouTube-Creator-Marketing-Playbook.pdf" target="_blank" rel="noopener">Agentio 2026 Playbook</a> (CPM by tier, 10,000+ integrations); <a href="https://creatorsagency.co/blog/youtube-sponsorship-rate-card-2026" target="_blank" rel="noopener">Creators Agency rate card 2026</a> (fee = views ÷ 1,000 × CPM; usage +20% per 30 days); <a href="https://www.agentio.com/blog/youtube-new-view-count-60-engaged-view-rate" target="_blank" rel="noopener">Agentio, 3 Sep 2026</a> (52% engaged-view rate, Fitness). Accessed 22 Sep 2026.</div></div>
    <div class="card"><h3>Reach index: what it means</h3><p class="small">Median views per subscriber, indexed so that the bench median is 1.00. A channel at 2.00 gets twice the views per subscriber of the typical correspondent here. It is recomputed every time the data refreshes. It replaces the invented "performance index" of the first version, and it only ranks these sixteen against each other.</p></div>
    <div class="card"><h3>Contracted once, refreshed each quarter</h3><p class="small">One agreement per correspondent: a monthly minimum, the rate card above, and pre-priced options for an extra video, a usage extension and Boost rights. An extra wave is a notice, not a renegotiation. The draft term is ${DATA.desk.draftDays} days for everyone. Correspondents whose pieces move the numbers stay; the bench is rebalanced by beat. Every correspondent receives the style guide and claims register at signing.</p></div>
  </div>`;
}

  const withRead = state.pieces.filter(p => p.metrics);
  const views = withRead.reduce((s,p) => s + p.metrics.views, 0);
  const old = DATA.facts.oldDays, oldPost = oldPostDiscovery();

  const postStages = DATA.facts.oldStages.slice(2).map(([n, d]) => `${n.toLowerCase()} ${d}`).join(", ");
  const capped = state.amberUsed >= DATA.desk.amberAllowance;
  const rows = live.sort((a,b) => a.liveDay - b.liveDay).map(p => { const t = cardById(p.trendId), c = creatorById(p.creatorId); return `<tr><td>${esc(t.title)}</td><td>${esc(c.name)}</td><td>${t.appears}</td><td>${p.commissionedDay}</td><td>${p.liveDay}</td><td><b>${p.liveDay - t.appears}</b></td><td>${p.liveDay - p.commissionedDay}</td><td>${p.check ? laneTag(p.check.lane) : ""}</td><td>${p.metrics ? fmt(p.metrics.views) : "<span class='muted'>pending</span>"}${p.metrics && p.metrics.boostViews ? `<div class="small muted">after boost ${fmt(p.metrics.boostViews)}</div>` : p.boosted ? " (boosted)" : ""}</td></tr>`; }).join("");

    <div class="stat"><div class="n">${state.redLogged}</div><div class="l">Pieces sent to legal and logged</div></div>
    <div class="stat"><div class="n">${views ? fmt(views) : "–"}</div><div class="l">Simulated 48-hour views across pieces with a read (before any boost)</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Today's process against this desk</h2>
    <div class="small muted" style="margin-bottom:6px">Illustrative today, ${old} days from brief to live (team estimate): ${stages}</div><div class="bar grey"><i style="width:100%"></i></div>

    <div class="small muted" style="margin:12px 0 6px">This desk, commission-to-live so far: ${avgCtl === null ? "no piece live yet" : avgCtl.toFixed(1) + " days"}</div><div class="bar blue"><i style="width:${w(avgCtl)}%"></i></div>

  const age = fileAgeHours();
  return `<h1>What is real, what is modelled, what is simulated</h1>

    <div class="card"><h2>Modelled (formula shown)</h2><ul class="tight small">
      <li><b>Rate card</b>: median views × 0.52 engaged share ÷ 1,000 × a published CPM tier ($51 / $28 / $22). Short = half. Not any creator's rate.</li>
      <li><b>Reach index</b>: views per subscriber, bench median = 1.00.</li>
      <li><b>Momentum</b>: 50 + week-on-week change ÷ 2 for search and pageview signals; 50 + 20 × log10(views ÷ 10,000) for YouTube view totals; a search or pageview signal with no change figure counts as neutral (50). Minus the card's decay for each day it is not covered.</li>
      <li><b>Today's process</b>: the ${DATA.facts.oldDays}-day split is the team's illustrative timeline; the published range is 2 to 6 weeks from first contact to live (Creators Agency, 2026, finance-sector deal data).</li>
    </ul></div>
    <div class="card"><h2>Simulated</h2><ul class="tight small">
      <li><b>The day-by-day reveal and decay</b> of trends, the ${DATA.desk.draftDays}-day draft term, the ${DATA.desk.legalTurnaround}-day legal turnaround, the amber allowance of ${DATA.desk.amberAllowance}.</li>
      <li><b>Every assignment, brief, draft and outcome.</b> No correspondent was contacted. The draft scripts are the desk's test scripts and are not written or said by anyone on the bench.</li>
      <li><b>The 48-hour read</b>: a projection from the channel's real median views (formula in the code), and the boost, an arbitrary ×3.2 multiplier: no published benchmark was found for Boost uplift in 48 hours. No published benchmark gives the share of views arriving in 48 hours either; Brand Lift needs a 10-day study, so no brand-lift number is shown.</li>
    </ul></div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Where Google products sit in the pilot desk</h2><div class="kv">${prod}</div>
    <div class="src">Names as Google uses them in September 2026: YouTube Creator Partnerships (formerly BrandConnect, announced 23 Mar 2026), Creator partnerships boost, the brand pulse report (launched 9 Oct 2025), Insights Finder, Gemini, Gemini Notebook (NotebookLM was renamed on 16 Jul 2026). Insights Finder needs a Google account representative and its outputs are confidential, which is one reason the prototype uses public stand-ins.</div></div>
  <div class="card" style="margin-top:16px"><h2>How the data refreshes</h2>
    <p class="small">A GitHub Action runs <code>scripts/fetch_data.py</code> once a day (09:17 UTC) and commits <code>data/live.json</code> and, with the snapshot re-embedded, <code>index.html</code>. The script uses no API key: YouTube channel feeds and channel pages, the Wikimedia pageviews API and Google Trends' web endpoints. When a source fails, the last good value is kept and marked stale; nothing is estimated or invented. This page loads the file when it opens, falls back to a snapshot embedded in the page, and then refreshes the Wikipedia figures directly in your browser. The top bar reads "Daily file · refreshed" when the file loaded, "Daily file from ..., not refreshed since" when it is more than ${FILE_OLD_AFTER_H} hours old, and "Snapshot" when it fell back to the embedded copy.</p>
