<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>The Creator Newsroom</title>
<meta name="description" content="A student prototype of a creator-marketing desk run like a newsroom, on real data: a morning trend board, a retained bench of real channels, a first read that sorts scripts into green, amber or red. Not a Google product.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="folio">
    <span>The Creator Newsroom</span>
    <span id="brandLine">Brooks Running · creator desk</span>
    <span id="dataInd" class="dataind">Data · loading</span>
  </div>
  <div class="mastrow">
    <h1 class="wordmark">Creator desk<small>Run like a newsroom, not a campaign</small></h1>
    <div class="clock">Day <b id="dayNum">01</b>
      <button class="btn" onclick="advanceDay()">Advance one day</button>
      <button class="btn ghost" onclick="resetAll()">Reset</button>
    </div>
  </div>
  <nav class="sections" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
